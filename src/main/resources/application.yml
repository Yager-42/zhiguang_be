server:
  port: 8080

spring:
  application:
    name: zhiguang
  datasource:
    url: jdbc:mysql://localhost:3306/zhiguang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: zhiguang
    password: zhiguang123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:32}
      minimum-idle: ${DB_POOL_MIN_IDLE:8}
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      redisson:
        connection-pool-size: ${REDISSON_CONNECTION_POOL_SIZE:128}
        connection-minimum-idle-size: ${REDISSON_CONNECTION_MINIMUM_IDLE_SIZE:32}
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
        batch.size: 32768
        compression.type: lz4
    listener:
      ack-mode: manual
    admin:
      auto-create: true
  cassandra:
    contact-points: localhost
    port: 9042
    local-datacenter: datacenter1
    keyspace-name: zhiguang
    schema-action: none
    connection:
      connect-timeout: 10s
      init-query-timeout: 10s
    request:
      timeout: 10s
  elasticsearch:
    uris:
      - http://localhost:9200
  ai:
    dashscope:
      # Keep startup passing when moderation is disabled. Production should override this.
      api-key: ${AI_DASHSCOPE_API_KEY:placeholder-not-used-unless-moderation-enabled}
      chat:
        options:
          model: ${AI_DASHSCOPE_MODEL:qwen-plus}

rocketmq:
  name-server: localhost:9876
  producer:
    group: zhiguang-promotion-command-producer

comment:
  cache:
    invalidation-window-ms: ${COMMENT_CACHE_INVALIDATION_WINDOW_MS:100}
  executor:
    read:
      core-size: ${COMMENT_READ_CORE_SIZE:8}
      max-size: ${COMMENT_READ_MAX_SIZE:16}
      queue-capacity: ${COMMENT_READ_QUEUE_CAPACITY:200}
    outbox:
      core-size: ${COMMENT_OUTBOX_CORE_SIZE:2}
      max-size: ${COMMENT_OUTBOX_MAX_SIZE:4}
      queue-capacity: ${COMMENT_OUTBOX_QUEUE_CAPACITY:50}
  kafka:
    write-topic: comment-write
    event-topic: comment-events
    feedback-topic: comment-feedback
    write-partitions: ${COMMENT_WRITE_PARTITIONS:8}
    event-partitions: ${COMMENT_EVENT_PARTITIONS:8}
    consumer-concurrency: ${COMMENT_WRITE_CONCURRENCY:4}
    write-retry-attempts: ${COMMENT_WRITE_RETRY_ATTEMPTS:10}
    write-retry-delay-ms: ${COMMENT_WRITE_RETRY_DELAY_MS:1000}
    write-retry-multiplier: ${COMMENT_WRITE_RETRY_MULTIPLIER:2}
    write-retry-max-delay-ms: ${COMMENT_WRITE_RETRY_MAX_DELAY_MS:10000}
  outbox:
    batch-size: ${COMMENT_OUTBOX_BATCH_SIZE:500}
    claim-seconds: ${COMMENT_OUTBOX_CLAIM_SECONDS:30}
    publish-interval-ms: ${COMMENT_OUTBOX_PUBLISH_INTERVAL_MS:50}
    retention-hours: ${COMMENT_OUTBOX_RETENTION_HOURS:24}
    clean-batch-size: ${COMMENT_OUTBOX_CLEAN_BATCH_SIZE:1000}
    clean-interval-ms: ${COMMENT_OUTBOX_CLEAN_INTERVAL_MS:86400000}
  metrics:
    sample-interval-ms: ${COMMENT_METRICS_SAMPLE_INTERVAL_MS:5000}

cache:
  l2:
    comment-page:
      ttl-seconds: ${COMMENT_PAGE_CACHE_TTL_SECONDS:3}
      max-size: ${COMMENT_PAGE_CACHE_MAX_SIZE:5000}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

id:
  snowflake:
    worker-id: ${SNOWFLAKE_WORKER_ID:1}
    datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}

auth:
  jwt:
    private-key: classpath:keys/private.pem
    public-key: classpath:keys/public.pem

wallet:
  platform-user-id: ${WALLET_PLATFORM_USER_ID:0}
  registration-grant-amount: ${WALLET_REGISTRATION_GRANT_AMOUNT:100}

content-reward:
  enabled: ${CONTENT_REWARD_ENABLED:true}
  post-amount: ${CONTENT_REWARD_POST_AMOUNT:10}
  comment-amount: ${CONTENT_REWARD_COMMENT_AMOUNT:2}

promotion:
  slot-auction:
    feed-top-slot-count: ${PROMOTION_FEED_TOP_SLOT_COUNT:1}
    search-top-slot-count: ${PROMOTION_SEARCH_TOP_SLOT_COUNT:1}
    feed-reserve-price: ${PROMOTION_FEED_RESERVE_PRICE:1}
    search-reserve-price: ${PROMOTION_SEARCH_RESERVE_PRICE:1}
    window-minutes: ${PROMOTION_WINDOW_MINUTES:60}
    cache-ttl-seconds: ${PROMOTION_CACHE_TTL_SECONDS:300}
    settle-batch-size: ${PROMOTION_SETTLE_BATCH_SIZE:50}
    close-window-delay-ms: ${PROMOTION_CLOSE_WINDOW_DELAY_MS:30000}
  bprime:
    enabled: ${PROMOTION_BPRIME_ENABLED:false}
    command-topic: ${PROMOTION_BPRIME_COMMAND_TOPIC:zhiguang_promotion_auction_commands_v2}
    command-consumer-group: ${PROMOTION_BPRIME_COMMAND_CONSUMER_GROUP:zhiguang-promotion-command-consumer}
    decision-topic: ${PROMOTION_BPRIME_DECISION_TOPIC:zhiguang.promotion.auction.decisions.v2}
    projection-consumer-group: ${PROMOTION_BPRIME_PROJECTION_CONSUMER_GROUP:zhiguang-promotion-projection-consumer}
    fanout-consumer-group: ${PROMOTION_BPRIME_FANOUT_CONSUMER_GROUP:zhiguang-promotion-fanout-consumer}
    kafka-send-timeout-ms: ${PROMOTION_BPRIME_KAFKA_SEND_TIMEOUT_MS:10000}
    hot-state-ttl-seconds: ${PROMOTION_BPRIME_HOT_STATE_TTL_SECONDS:86400}
    command-idempotency-ttl-seconds: ${PROMOTION_BPRIME_COMMAND_IDEMPOTENCY_TTL_SECONDS:86400}
    settled-compensation-lookback-seconds: ${PROMOTION_BPRIME_SETTLED_COMPENSATION_LOOKBACK_SECONDS:604800}
    legacy-command-recovery-enabled: ${PROMOTION_BPRIME_LEGACY_COMMAND_RECOVERY_ENABLED:false}
    command-publish-scan-delay-ms: ${PROMOTION_BPRIME_COMMAND_PUBLISH_SCAN_DELAY_MS:1000}
    command-publish-claim-timeout-ms: ${PROMOTION_BPRIME_COMMAND_PUBLISH_CLAIM_TIMEOUT_MS:5000}
    command-decision-timeout-ms: ${PROMOTION_BPRIME_COMMAND_DECISION_TIMEOUT_MS:300000}
    command-publish-batch-size: ${PROMOTION_BPRIME_COMMAND_PUBLISH_BATCH_SIZE:100}
    projection-concurrency: ${PROMOTION_BPRIME_PROJECTION_CONCURRENCY:1}
    command-publisher-core-size: ${PROMOTION_BPRIME_COMMAND_PUBLISHER_CORE_SIZE:6}
    command-publisher-max-size: ${PROMOTION_BPRIME_COMMAND_PUBLISHER_MAX_SIZE:8}
    command-publisher-worker-count: ${PROMOTION_BPRIME_COMMAND_PUBLISHER_WORKER_COUNT:8}
    decision-max-in-flight: ${PROMOTION_BPRIME_DECISION_MAX_IN_FLIGHT:1024}
    command-publisher-queue-capacity: ${PROMOTION_BPRIME_COMMAND_PUBLISHER_QUEUE_CAPACITY:1024}
    fast-reject-enabled: ${PROMOTION_BPRIME_FAST_REJECT_ENABLED:true}
    fast-reject-maximum-campaigns: ${PROMOTION_BPRIME_FAST_REJECT_MAXIMUM_CAMPAIGNS:200000}
    fast-reject-expire-after-access-seconds: ${PROMOTION_BPRIME_FAST_REJECT_EXPIRE_AFTER_ACCESS_SECONDS:7200}
    fast-reject-expiry-margin-ms: ${PROMOTION_BPRIME_FAST_REJECT_EXPIRY_MARGIN_MS:1000}
    fast-reject-precheck-batch-size: ${PROMOTION_BPRIME_FAST_REJECT_PRECHECK_BATCH_SIZE:512}
    fast-reject-precheck-worker-count: ${PROMOTION_BPRIME_FAST_REJECT_PRECHECK_WORKER_COUNT:2}
    fast-reject-precheck-queue-capacity: ${PROMOTION_BPRIME_FAST_REJECT_PRECHECK_QUEUE_CAPACITY:65536}
    fast-reject-precheck-max-wait-micros: ${PROMOTION_BPRIME_FAST_REJECT_PRECHECK_MAX_WAIT_MICROS:200}
    web-socket-inbound-thread-count: ${PROMOTION_BPRIME_WS_INBOUND_THREAD_COUNT:8}
    web-socket-outbound-thread-count: ${PROMOTION_BPRIME_WS_OUTBOUND_THREAD_COUNT:8}
    web-socket-channel-queue-capacity: ${PROMOTION_BPRIME_WS_CHANNEL_QUEUE_CAPACITY:65536}
    web-socket-native-session-queue-capacity: ${PROMOTION_BPRIME_WS_NATIVE_SESSION_QUEUE_CAPACITY:4096}
    feed-slot-count: ${PROMOTION_FEED_TOP_SLOT_COUNT:1}
    search-slot-count: ${PROMOTION_SEARCH_TOP_SLOT_COUNT:1}
    feed-reserve-price: ${PROMOTION_FEED_RESERVE_PRICE:1}
    search-reserve-price: ${PROMOTION_SEARCH_RESERVE_PRICE:1}

storage:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:zhiguang}
  region: ${MINIO_REGION:us-east-1}
  public-domain: ${MINIO_PUBLIC_DOMAIN:}

canal:
  enabled: false
  host: localhost
  port: 11111
  destination: example
  username: ""
  password: ""
  filter: zhiguang.outbox
  batchSize: 100
  intervalMs: 1000

counter:
  rebuild:
    enabled: false

singleflight:
  enabled: ${SINGLEFLIGHT_ENABLED:true}
  mode: ${SINGLEFLIGHT_MODE:distributed}
  defaults:
    running-ttl-millis: ${SINGLEFLIGHT_RUNNING_TTL_MILLIS:15000}
    result-ttl-millis: ${SINGLEFLIGHT_RESULT_TTL_MILLIS:600000}
    failed-result-ttl-millis: ${SINGLEFLIGHT_FAILED_RESULT_TTL_MILLIS:60000}
    follower-max-wait-millis: ${SINGLEFLIGHT_FOLLOWER_MAX_WAIT_MILLIS:20000}
    stream-block-timeout-millis: ${SINGLEFLIGHT_STREAM_BLOCK_TIMEOUT_MILLIS:3000}
    poll-fallback-interval-millis: ${SINGLEFLIGHT_POLL_FALLBACK_INTERVAL_MILLIS:2000}
    takeover-detect-millis: ${SINGLEFLIGHT_TAKEOVER_DETECT_MILLIS:10000}
    heartbeat-interval-millis: ${SINGLEFLIGHT_HEARTBEAT_INTERVAL_MILLIS:1000}
    l1-cache-enabled: ${SINGLEFLIGHT_L1_CACHE_ENABLED:true}
    l1-cache-ttl-millis: ${SINGLEFLIGHT_L1_CACHE_TTL_MILLIS:30000}
    l1-cache-max-size: ${SINGLEFLIGHT_L1_CACHE_MAX_SIZE:1000}
  stages:
    counter-sds:
      enabled: ${SINGLEFLIGHT_COUNTER_SDS_ENABLED:true}
      mode: ${SINGLEFLIGHT_COUNTER_SDS_MODE:}
    user-counter:
      enabled: ${SINGLEFLIGHT_USER_COUNTER_ENABLED:true}
      mode: ${SINGLEFLIGHT_USER_COUNTER_MODE:}
    feed-author-head:
      enabled: ${SINGLEFLIGHT_FEED_AUTHOR_HEAD_ENABLED:true}
      mode: ${SINGLEFLIGHT_FEED_AUTHOR_HEAD_MODE:}
    moderation-llm:
      enabled: ${SINGLEFLIGHT_MODERATION_LLM_ENABLED:true}
      mode: ${SINGLEFLIGHT_MODERATION_LLM_MODE:}
    comment-page-head:
      enabled: ${SINGLEFLIGHT_COMMENT_PAGE_ENABLED:true}
      mode: distributed
      running-ttl-millis: ${SINGLEFLIGHT_COMMENT_PAGE_RUNNING_TTL_MILLIS:15000}
      result-ttl-millis: ${SINGLEFLIGHT_COMMENT_PAGE_RESULT_TTL_MILLIS:30000}
      failed-result-ttl-millis: ${SINGLEFLIGHT_COMMENT_PAGE_FAILED_TTL_MILLIS:3000}
      follower-max-wait-millis: ${SINGLEFLIGHT_COMMENT_PAGE_FOLLOWER_WAIT_MILLIS:20000}
      takeover-detect-millis: ${SINGLEFLIGHT_COMMENT_PAGE_TAKEOVER_MILLIS:10000}
      heartbeat-interval-millis: ${SINGLEFLIGHT_COMMENT_PAGE_HEARTBEAT_MILLIS:1000}
      l1-cache-enabled: true
      l1-cache-ttl-millis: ${SINGLEFLIGHT_COMMENT_PAGE_L1_TTL_MILLIS:3000}
      l1-cache-max-size: ${SINGLEFLIGHT_COMMENT_PAGE_L1_MAX_SIZE:5000}

recommendation:
  gorse:
    endpoint: ${GORSE_ENDPOINT:http://localhost:8087}
    api-key: ${GORSE_API_KEY:}
    timeout-ms: ${GORSE_TIMEOUT_MS:300}
    enabled: ${GORSE_ENABLED:false}

moderation:
  llm:
    enabled: ${MODERATION_LLM_ENABLED:false}
    min-confidence: ${MODERATION_LLM_MIN_CONFIDENCE:0.8000}
    max-content-chars: ${MODERATION_LLM_MAX_CONTENT_CHARS:4000}
    max-retries: ${MODERATION_LLM_MAX_RETRIES:3}
  notification:
    platform-actor-user-id: ${MODERATION_PLATFORM_ACTOR_USER_ID:0}

feed:
  home:
    mixed-enabled: false
  fanout:
    push-pull-threshold: 10000
  inbox:
    ttl-days: 30
  cache:
    timeline-ttl-seconds: 300
    author-head-ttl-seconds: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
