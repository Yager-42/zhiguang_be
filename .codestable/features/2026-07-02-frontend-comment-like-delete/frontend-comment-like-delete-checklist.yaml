doc_type: checklist
feature: 2026-07-02-frontend-comment-like-delete
status: done
summary: 评论点赞 + 删除实现步骤与检查项
steps:
  - id: 1
    name: 后端 liked 字段 + 前端类型/service
    description: 后端 CommentItemResponse 加 liked；CommentServiceImpl 注入 CounterService、item(row,texts,liked) 改签名、pageComments 接 userId 逐条 isLiked、pageReplies item 恒 false；CommentService 接口+CommentController.comments 接 jwt；修 2 个测试文件。前端 types/comment.ts 加 liked + CommentLikeResponse，commentService 加 like/unlike/delete
    exit_signal: 后端 mvn test 通过（含测试修复）+ list 接口返回含 liked；前端 npm run lint 通过；commentService 导出 like/unlike/delete
    verification: command
    deliverables: [CommentItemResponse.java, CommentServiceImpl.java, CommentService.java, CommentController.java, CommentControllerTest.java, CommentServiceImplTest.java, types/comment.ts, services/commentService.ts]
    status: done
    checks:
      - id: 1.1
        description: 后端 mvn test 通过（CommentItemResponse 加 liked；CommentServiceImpl 注入 CounterService 手写构造器；item(row,texts,liked) 改签名；pageComments 接 userId；pageReplies item 恒 false；CommentControllerTest 2处补 liked 参数；CommentServiceImplTest 补 counterService mock + stub isLiked）
        status: passed
      - id: 1.2
        description: list 接口返回 items 每条含 liked（curl：赞过一条后重新 list，该条 liked=true；未赞的 liked=false）
        status: passed
      - id: 1.3
        description: isLiked 的 entityId 用 String.valueOf(commentId) 与 controller like/unlike 对齐（避免 key 不一致导致 liked 恒 false）
        status: passed
      - id: 1.4
        description: replies 路径 item 恒传 false（grep 确认 pageReplies 不调 isLiked）
        status: passed
      - id: 1.5
        description: 前端 tsc --noEmit 无错误；CommentItem 含 liked:boolean；CommentLikeResponse={changed:boolean}；commentService 导出 like/unlike/delete
        status: passed
  - id: 2
    name: CommentSection 点赞按钮
    description: item 加心形点赞按钮，本地 liked 状态 + likeCount 按 changed ±1 + loadingRef 同步守卫防连点
    exit_signal: 点赞/取消点赞浏览器可见，计数正确，连点不乱；tsc 通过
    verification: browser
    deliverables: [CommentSection.tsx 修改, CommentSection.module.css 修改]
    status: passed
    checks:
      - id: 2.1
        description: tsc --noEmit 无错误
        status: passed
      - id: 2.2
        description: 点赞 changed=true 时 likeCount+1 且心形高亮；取消 changed=true 时 likeCount-1 恢复
        status: passed
      - id: 2.3
        description: changed=false 时计数不动且本地 liked 不翻转（保持后端初始值）
        status: passed
      - id: 2.4
        description: loadingRef 同步守卫，操作中按钮禁用，连点不发多次请求
        status: passed
  - id: 3
    name: CommentSection 作者删除按钮
    description: item 加删除按钮，仅 creatorId===user.id 显示；删除 204 后本地 body 改[已删除]+deleted=true+按钮禁用，不移除
    exit_signal: 作者可见删除按钮、非作者不可见、删除后变[已删除]；tsc 通过
    verification: browser
    deliverables: [CommentSection.tsx 修改, CommentSection.module.css 修改]
    status: passed
    checks:
      - id: 3.1
        description: tsc --noEmit 无错误
        status: passed
      - id: 3.2
        description: 仅 creatorId===user?.id 时渲染删除按钮；乐观占位项（__optimistic）不显示删除按钮
        status: passed
      - id: 3.3
        description: 删除 204 后本地该条 body=[deleted]（与后端 DELETED_BODY 一致）、deleted=true、点赞/删除按钮禁用，不从列表移除
        status: passed
      - id: 3.4
        description: 删除失败（400 网络/非作者/不存在）静默忽略，按钮恢复可点
        status: passed
  - id: 4
    name: 联调与 harden
    description: 前后端联调 3 接口；清洁度 grep；grep 确认无 /replies 超范围调用
    exit_signal: 浏览器三操作验证 + Network 见 200/204 + grep 无 console/TODO/replies + npm run lint 通过
    verification: browser
    deliverables: []
    status: passed
    checks:
      - id: 4.1
        description: 点赞/取消点赞/删除三个操作浏览器真实打通（Network 见 200/204）
        status: passed
      - id: 4.2
        description: 刷新后删除态与后端一致（仍[已删除]）
        status: passed
      - id: 4.3
        description: grep 无 /comments/{id}/replies 调用（超范围核对）
        status: passed
      - id: 4.4
        description: grep 无 console.log/TODO/FIXME；无用 import 由 lint 兜底
        status: passed
