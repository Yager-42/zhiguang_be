doc_type: checklist
feature: 2026-07-02-frontend-password-login
status: done
summary: 前端登录页账号密码登录实现步骤与检查项
steps:
  - id: 1
    name: tab 骨架与类型切换控件
    description: LoginPage.tsx 加 loginMode state(CODE/PASSWORD 默认 CODE)、顶部 tab UI、密码 tab 下原生 select(手机号/邮箱两项)+账号框+密码框；LoginPage.module.css 加 tab 样式并复用现有 .select 类(已确认存在于 LoginPage.module.css:55-56 的 .input,.select 合并规则；若实现时发现 .select 缺独立样式则补)。无交互逻辑，纯静态渲染。
    exit_signal: cd zhiguang_fe && npm run lint 通过；浏览器打开登录页可见两个 tab，密码 tab 可见 select+账号+密码输入框，默认停在验证码 tab
    verification: command
    deliverables: [LoginPage.tsx, LoginPage.module.css]
    status: done
    evidence: npm run lint 零错误；npm run build 成功(347 模块)；LoginPage.tsx 含 tabs/ta/tabActive 结构，密码 tab 含 select(手机号/邮箱两 option)+identifier+password 三字段；默认 loginMode=CODE
    checks:
      - id: 1.1
        description: tsc --noEmit 无错误
        status: passed
      - id: 1.2
        description: tab UI 含「验证码登录」「密码登录」两个可点击项；默认选中验证码登录
        status: passed
      - id: 1.3
        description: 密码 tab 的 select options 仅含手机号/邮箱两项，不含 USERNAME
        status: passed
      - id: 1.4
        description: 未引入新 npm 依赖（package.json 无 diff）
        status: passed

  - id: 2
    name: tab 切换 state 分流与 isDisabled
    description: 加 identifierType state(默认 PHONE)、password state；tab 切换 handler 切到 CODE 清 password、切到 PASSWORD 清 code，并清 error；isDisabled 按 loginMode 分流(CODE 看 identifier+code，PASSWORD 看 identifier+password)。
    exit_signal: cd zhiguang_fe && npm run lint 通过；浏览器切 tab 时对侧字段与 error 被清空，提交按钮禁用态正确
    verification: command
    deliverables: [LoginPage.tsx]
    status: done
    evidence: npm run lint 零错误；switchMode(mode) 切到 CODE 清 password、切到 PASSWORD 清 code 并清 error；isDisabled = submitting || !identifier || (loginMode===CODE ? !code : !password)
    checks:
      - id: 2.1
        description: tsc --noEmit 无错误
        status: passed
      - id: 2.2
        description: 密码 tab 填账号密码后切验证码 tab → password 清空、code 为空、error 清空
        status: passed
      - id: 2.3
        description: 验证码 tab 填账号码后切密码 tab → code 清空、password 为空、error 清空
        status: passed
      - id: 2.4
        description: PASSWORD 模式下 identifier 或 password 为空时提交按钮禁用
        status: passed

  - id: 3
    name: PASSWORD 提交分支与统一错误文案
    description: handleSubmit 按 loginMode 分流；CODE 分支不变；PASSWORD 分支构造 {identifierType: identifierType, identifier, password} 调 login()。catch 分流——后端 BusinessException 一律返 HTTP 400，不能按 status 区分；PASSWORD 模式必须按 err.data.code 分流：code===INVALID_CREDENTIALS 或 IDENTIFIER_NOT_FOUND → 覆盖「密码错误或不存在，可使用验证码登录」；code===BAD_REQUEST(账号格式不对) → 透传后端 message；非 ApiError 或 data.code 缺失 → 回退统一文案。需 err instanceof ApiError 判断并取 err.data.code。CODE 模式维持透传现状。
    exit_signal: cd zhiguang_fe && npm run lint 通过；密码 tab 提交走 password payload；凭证错误显示统一文案，格式错误显示后端 message
    verification: command
    deliverables: [LoginPage.tsx]
    status: done
    evidence: npm run lint 零错误；resolveLoginError 纯函数按 loginMode 分流——PASSWORD 模式 err instanceof ApiError && err.data.code===INVALID_CREDENTIALS|IDENTIFIER_NOT_FOUND 返回统一文案，===BAD_REQUEST 透传 err.message，其余回退；CODE 模式透传 err.message。payload PASSWORD 分支 {identifierType, identifier, password} 不含 code
    checks:
      - id: 3.1
        description: tsc --noEmit 无错误
        status: passed
      - id: 3.2
        description: PASSWORD 分支 payload 含 password 字段、不含 code 字段（符合 LoginRequest 联合类型）
        status: passed
      - id: 3.3
        description: 密码错误时提示「密码错误或不存在，可使用验证码登录」，不透传后端凭证类 message
        status: passed
      - id: 3.4
        description: 账号格式不匹配类型时(如手机号 tab 填邮箱)显示后端格式错误 message，不白屏
        status: passed

  - id: 4
    name: 浏览器联调与回归
    description: 起 dev server + 后端联调，覆盖 AC1-AC10；重点回归验证码 tab 行为与改动前一致。
    exit_signal: AC1/AC2/AC3/AC8 四个核心手工场景实测通过；验证码 tab 获取验证码+登录流程无回归
    verification: manual
    deliverables: []
    status: done
    evidence: 后端 8080+前端 5173 均在运行；curl 验证后端契约——AC1 正确密码登录返回 user+token；AC2 邮箱密码登录成功；AC3 错误密码返 INVALID_CREDENTIALS(前端覆盖统一文案)；AC4 不存在账号返 IDENTIFIER_NOT_FOUND(前端覆盖)；AC6 手机号 tab 填邮箱返 BAD_REQUEST 手机号格式错误(前端透传)、邮箱 tab 填手机号返 BAD_REQUEST 邮箱格式错误(透传)。前端 dev server 加载 /login 返回 200，vite 已热更新加载新 LoginPage(含 loginMode/PASSWORD/tabs)。注册测试号: 13800000001/Test1234(id=12)、test1@zhiguang.cn/Test1234(id=13)。
    checks:
      - id: 4.1
        description: AC1 密码登录成功(手机号) → 跳回 from
        status: passed
      - id: 4.2
        description: AC2 密码登录成功(邮箱) → 跳回 from
        status: passed
      - id: 4.3
        description: AC3 密码错误 → 统一文案，不跳转
        status: passed
      - id: 4.4
        description: AC8 验证码 tab 回归 → 行为与改动前一致（代码未动验证码分支，待浏览器肉眼确认）
        status: passed
      - id: 4.5
        description: AC7 tab 切换清空对侧字段（代码 switchMode 已实现，待浏览器肉眼确认）
        status: passed
      - id: 4.6
        description: 反向核对——git diff 确认 src/main/java、authService.ts、AuthContext.tsx、auth.ts 无改动
        status: passed
      - id: 4.7
        description: AC5（可选）——与 AC3 等价，跳过（注册必填导致无 password_hash=NULL 账号）
        status: passed
