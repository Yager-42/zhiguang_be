    name: service + types（FeedResponse 补 nextCursor + followFeed 方法）
    description: types/knowpost.ts 的 FeedResponse 补 nextCursor?: string 字段；knowpostService 加 followFeed(cursor, accessToken) 方法，GET /feed/follow?cursor=，用 URLSearchParams 构建 query（仓库惯例），需 token
    exit_signal: cd zhiguang_fe && npm run lint 通过；curl GET /knowposts/feed/follow -H "Authorization: Bearer <token>" 返回 200 + items（验证接口契约）
    verification: command
    deliverables: [services/knowpostService.ts, types/knowpost.ts]
    status: done
    checks:
      - id: 1.1
        description: tsc --noEmit 无错误
        status: passed
      - id: 1.2
        description: FeedResponse 补 nextCursor?: string 字段（后端已返回，前端类型对齐）；注明 followFeed 的 page/size 是后端占位，关注 tab 只用 items/hasMore/nextCursor
        status: passed
      - id: 1.3
        description: followFeed(cursor: string|null, accessToken: string) 签名；cursor 为 null 时无 query；cursor 非空时 URLSearchParams set cursor；显式传 accessToken；不用 encodeURIComponent（URLSearchParams 惯例，: 不需编码）
        status: passed
