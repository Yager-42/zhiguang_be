doc_type: checklist
feature: 2026-07-07-frontend-promotion
status: pending
summary: 前端推广竞价模块实现步骤与检查项
steps:
  - id: 1
    name: service + types + 后端 snapshot DTO string 化
    description: types/promotion.ts 定义 PromotionResourceType/PromotionCampaign/CreateCampaignRequest/SubmitBidRequest/SubmitBidResponse/RankingItem/AuctionSnapshot/WalletBalance（id 全 string）；services/promotionService.ts 加 5 方法（createCampaign/getCampaign/submitBid/snapshot/activeAllocations）+ walletService.balance；后端 PromotionAuctionSnapshot + PromotionRankingItem long→String + 构造处 + 测试
    exit_signal: cd zhiguang_fe && npm run lint 通过；后端 mvn compile + promotion 测试通过；curl 5 接口返回 string id（snapshot auctionWindowId/campaignId/bidderUserId/postId 带引号）
    verification: command
    deliverables: [services/promotionService.ts, services/walletService.ts, types/promotion.ts, 后端 2 DTO + 构造 + 测试]
    status: done
    checks:
      - id: 1.1
        description: tsc --noEmit 无错误；后端 mvn compile 通过
        status: done
      - id: 1.2
        description: types id 全 string（snowflake 精度防御）；后端 PromotionAuctionSnapshot auctionWindowId + PromotionRankingItem campaignId/bidderUserId/postId 改 String + 构造处 String.valueOf（SnapshotService 3 处 snapshot:37/42/45 + 2 处 ranking:63/83）+ 测试适配（3 测试文件 fixture 改 string）；WalletBalance 4 字段（availableBalance/heldBalance/escrowedBalance/status）
        status: done
      - id: 1.3
        description: promotionService 5 方法签名正确（createCampaign/getCampaign/submitBid/snapshot/activeAllocations），路径 /api/v1/promotions/*（campaignId path param 后端接 long，前端传数字串即可），显式传 token；walletService.balance GET /api/v1/wallet/me
        status: done
  - id: 2
    name: PromotionRoomPage + createCampaign 表单
    description: 新建 pages/PromotionRoomPage.tsx；createCampaign 表单内联（资源位 feed_top_slot/search_top_slot + 时间段默认现在~+24h）+ 提交跳竞价视图；/promotion/:postId 路由
    exit_signal: npm run lint 通过；浏览器点推广进 /promotion/:postId + 选资源位 + 提交 createCampaign 成功拿到 campaignId + 进竞价视图
    verification: browser
    deliverables: [pages/PromotionRoomPage.tsx, pages/PromotionRoomPage.module.css, App.tsx 路由]
    status: done
    checks:
      - id: 2.1
        description: tsc --noEmit 无错误
        status: done
      - id: 2.2
        description: createCampaign 表单：资源位选择（feed_top_slot/search_top_slot）+ 时间段（startAt 锁定 now 不可调，endAt 默认 now+24h 可调但下限 now+2h）；startAt/endAt 用 new Date().toISOString()（ISO Z 串）；提交调 createCampaign 拿 campaignId
        status: done
      - id: 2.3
        description: App.tsx 加 /promotion/:postId 路由指向 PromotionRoomPage；postId 从 useParams 取
        status: done
      - id: 2.4
        description: createCampaign 成功后切换到竞价视图（同页面，不跳转）；失败显示错误态
        status: done
  - id: 3
    name: 竞价视图 + 排名轮询 + 出价 + 积分
    description: 竞价视图：snapshot 排名展示（campaignId/postId/bidAmount/rank + 你的位次高亮）+ 剩余时间 + 4s 轮询（OPEN 时轮询 SETTLED 停）+ 出价表单（金额≤积分 + idempotencyKey UUID）+ 积分余额显示 + 出价后立即轮询
    exit_signal: 浏览器出价 + submitBid 200 + snapshot 排名含出价 + 积分余额减少 + 4s 轮询排名更新 + grep 无 console.log/TODO + npm run lint 通过
    verification: browser
    deliverables: [pages/PromotionRoomPage.tsx 竞价视图]
    status: done
    checks:
      - id: 3.1
        description: snapshot 排名展示：ranking 列表（rank/bidAmount/postId）+ 你的位次高亮（String(user.id)===bidderUserId，显式 String() 归一化因 user.id 是 number）；剩余时间（windowEnd-now 倒计时）
        status: done
      - id: 3.2
        description: 4s 轮询 snapshot（OPEN 时，useEffect cleanup 清 interval）；SETTLED 停轮询显示结算结果
        status: done
      - id: 3.3
        description: 出价表单：金额输入（≤积分余额前端校验）+ 提交调 submitBid（idempotencyKey=crypto.randomUUID）；submitBid 200 即结束出价 loading（不等排名更新，bprime 异步 1-3s）；立即触发一次轮询；8s 后排名仍无我的出价显示"出价处理中"提示（非 loading）；resultAvailable 后端恒 false 不依赖
        status: done
      - id: 3.4
        description: 积分余额显示"积分: N"（availableBalance，D4 文案改积分）；出价后余额减少（hold，重新拉 balance）；账户 status 非 ACTIVE 时出价显示后端错误信息
        status: done
      - id: 3.5
        description: grep 无 console.log / TODO / FIXME / 注释代码 / 死 import
        status: done
  - id: 4
    name: 入口接入 + harden + 清洁度
    description: CreatePage 发布成功段加"推广"按钮（跳 /promotion/:postId）；CourseDetailPage 作者区加"推广"按钮（作者可见，与举报按钮同条件 isSelfForReport 反向）；防重复出价 + 清洁度
    exit_signal: 浏览器 CreatePage 发布成功有"推广"按钮 + 详情页作者区有"推广"按钮 + 非作者无按钮 + grep 清洁 + lint 通过 + 反向核对（无 WebSocket / 无 wallet→points 后端重命名 / 无活动列表页）
    verification: browser
    deliverables: [pages/CreatePage.tsx, pages/CourseDetailPage.tsx 修改]
    status: done
    checks:
      - id: 4.1
        description: CreatePage 发布成功段（publishStatus.phase===succeeded）显示"推广"按钮，点击 navigate /promotion/:postId（用 postId state）
        status: done
      - id: 4.2
        description: CourseDetailPage 作者区加"推广"按钮（isSelfForReport 同条件，作者本人可见，与举报按钮并列）；点击跳 /promotion/:postId（detail.id）；非作者无按钮
        status: done
      - id: 4.3
        description: 防重复出价：出价 loading 期间按钮 disabled；idempotencyKey 每次新 UUID
        status: done
      - id: 4.4
        description: grep 无 console.log / TODO / FIXME / 注释代码 / 死 import；反向核对：前端无 @stomp/stompjs import、后端 wallet 代码未重命名（仅 snapshot DTO 改 String）、无活动管理列表页
        status: done