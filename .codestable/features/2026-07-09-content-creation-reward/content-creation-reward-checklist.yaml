doc_type: checklist
feature: 2026-07-09-content-creation-reward
status: done
summary: 内容创作积分奖励（发帖/发评论）实现步骤与检查项（r1 修订：发帖金额走 config 接口、catch 在 service 内、评论幂等拆两路径）
steps:
  - id: 1
    name: 枚举 + Properties + ContentRewardService 骨架 + 单测
    description: >
      新增 WalletLedgerReason.CONTENT_CREATION_REWARD；
      WalletBusinessType 新增 CONTENT（BOUNTY 是 dead enum 全仓库无使用，不复用）；
      新增 ContentRewardProperties（@ConfigurationProperties("content-reward")，enabled/postAmount/commentAmount，默认 true/10/2）；
      新增 ContentRewardService（wallet/service/，与 WalletRegistrationGrantService 并列）：
      rewardPostCreation(authorId, postId) / rewardCommentCreation(creatorId, commentId) 两方法，
      @Transactional(REQUIRES_NEW)，enabled=false 直接 return 0，
      调 walletService.grant(reason=CONTENT_CREATION_REWARD, businessType=CONTENT, businessRef="content-reward:post:{id}" / "content-reward:comment:{id}")。
      关键：catch 必须在 service 方法体内（try-catch 吞所有 Exception 返回 0，异常不冒泡 caller），避免 REQUIRES_NEW 子事务回滚异常让外层 @Transactional rollback-only。
    exit_signal: mvn -Dtest='ContentRewardService*' test 通过（grant 调用 / enabled=false no-op / 异常 catch 在 service 内返回 0 不 throw / 幂等重试只调一次）；mvn compile 通过
    verification: command
    deliverables: [WalletLedgerReason.java, WalletBusinessType.java, ContentRewardProperties.java, ContentRewardService.java, ContentRewardServiceTest.java]
    status: done
    checks:
      - id: 1.1
        description: >
          mvn compile 通过，无未使用 import
        status: done
      - id: 1.2
        description: >
          ContentRewardService 用 REQUIRES_NEW 独立事务；
          catch 在 service 方法体内（rewardPostCreation/rewardCommentCreation 内 try-catch 吞所有 Exception 返回 0，不 throw，异常不冒泡 caller）；
          enabled=false return 0 不调 grant
        status: done
      - id: 1.3
        description: >
          businessRef 格式 content-reward:post:{postId} / content-reward:comment:{commentId}；
          金额从 ContentRewardProperties 读（postAmount/commentAmount）；
          businessType=CONTENT，reason=CONTENT_CREATION_REWARD
        status: done
      - id: 1.4
        description: >
          单测覆盖：正常 grant 调用参数正确 / enabled=false no-op /
          grant 抛 BusinessException(WALLET_NOT_FOUND) 返回 0 不 throw /
          grant 抛非受检 RuntimeException 返回 0 不 throw（AC8 关键路径）/
          同 businessRef 重试幂等（grant 内置，mock 验证只调一次）
        status: done

  - id: 2
    name: 发帖挂载 completePublish（不改任何 DTO）
    description: >
      PublishAttemptService.completePublish（:168 knowPostMapper.completePublish 成功 + :171 markSucceeded 后）调 contentRewardService.rewardPostCreation(authorId, postId)；
      不改 PublishStatusResponse / PublishAcceptedResponse（completePublish 在 publishExecutor 异步线程返回 void，不回流 HTTP 响应，金额走 config 接口）；
      application.yml 加 content-reward 配置块（enabled: true / post-amount: 10 / comment-amount: 2）。
    exit_signal: mvn -Dtest='**/knowpost/**' test 通过；手工 curl 发帖后查 wallet available_balance +10 + ledger 有 CONTENT_CREATION_REWARD 记录；重试 completePublish ledger count=1；reward 失败（mock）不阻塞发布
    verification: command
    deliverables: [PublishAttemptService.java, application.yml]
    status: done
    checks:
      - id: 2.1
        description: >
          completePublish 在 markSucceeded 后调 rewardPostCreation（发布成功才发奖励，failPublish/stuck 恢复不发）；
          不改任何 DTO（PublishStatusResponse 不加 rewardAmount）
        status: done
      - id: 2.2
        description: >
          重试 completePublish（同 postId）grant 内置 businessRef 幂等只发一次（ledger count=1）；
          单测或手工验证
        status: done
      - id: 2.3
        description: >
          grant 失败（mock walletService 抛异常）→ service 内 catch 返回 0 → completePublish 主流程不受影响（帖子仍 published，attempt 仍 succeeded）；
          单测验证（注意：发帖侧 completePublish 调用方 runPublish 无外层事务，REQUIRES_NEW 天然隔离，rollback-only 风险低，但仍需验证 catch 生效）
        status: done
      - id: 2.4
        description: >
          application.yml content-reward 配置块；ContentRewardProperties 默认值 10/2/enabled=true
        status: done

  - id: 3
    name: 评论挂载 CommentWriteConsumer + config 接口（需登录态）
    description: >
      CommentWriteConsumer.handle（:80 updateStatus(succeeded) 后）调 contentRewardService.rewardCommentCreation(event.creatorId(), event.commentId())；
      新增 ContentRewardController 暴露 GET /api/v1/content-reward/config 返回 {enabled, postAmount, commentAmount}（ContentRewardConfigResponse DTO）；
      config 接口需登录态（不加 SecurityConfig permitAll 白名单，走默认 anyRequest().authenticated()，前端用带 token apiClient 调）。
    exit_signal: mvn -Dtest='**/comment/**' test 通过；手工 curl 发评论后查 wallet +2 + ledger 记录；重试两条路径 ledger count=1；带 token curl /api/v1/content-reward/config 返回 {enabled:true, postAmount:10, commentAmount:2}
    verification: command
    deliverables: [CommentWriteConsumer.java, ContentRewardController.java, ContentRewardConfigResponse.java]
    status: done
    checks:
      - id: 3.1
        description: >
          CommentWriteConsumer.handle 在 updateStatus(succeeded) 后调 rewardCommentCreation；
          event.creatorId()/commentId() 正确传参；不改 CommentSubmitResponse
        status: done
      - id: 3.2
        description: >
          AC5a：reward 成功后 @RetryableTopic 重试 → businessRef 幂等只发一次（ledger count=1）；
          AC5b：reward 失败（grant 抛异常被 service catch 返回 0）→ 评论仍 succeeded（updateStatus 已执行）+ ledger 无记录 + 重试走 status==succeeded 短路不补发（接受丢失，v1 取舍）；
          两条路径分别单测
        status: done
      - id: 3.3
        description: >
          AC8 评论侧：grant 抛非受检 RuntimeException → service 内 catch 不冒泡 → 评论主事务不回滚（comment insert + updateStatus succeeded 落库）；
          单测层验证 service catch；手工集成层（mock wallet 抛 RuntimeException 发评论，评论成功 + ledger 无记录）验证 REQUIRES_NEW 隔离
        status: done
      - id: 3.4
        description: >
          GET /api/v1/content-reward/config 需登录态（不带 token 401，带 token 200 返回配置）；
          ContentRewardController + ContentRewardConfigResponse；
          不加 SecurityConfig permitAll
        status: done

  - id: 4
    name: 前端 +N 积分提示 + config 拉取
    description: >
      前端新增 contentRewardService.config() 用带 token apiClient 调 GET /api/v1/content-reward/config（App 启动时或首次需要时拉，缓存内存）；
      CreatePage.tsx:387 发布成功段加 "+{postAmount} 积分" 提示（enabled=false 或 amount=0 不显示）；
      CommentSection.tsx:127 评论 submit 成功后加 "+{commentAmount} 积分" 轻提示（1.5s 自动消失）；
      金额统一来自 config 接口（不从 PublishStatusResponse / CommentSubmitResponse 取）。
    exit_signal: cd zhiguang_fe && npm run lint 通过；浏览器发帖成功显示 "+10 积分"、发评论显示 "+2 积分"；enabled=false 时不显示
    verification: browser
    deliverables: [services/contentRewardService.ts, pages/CreatePage.tsx, components/comment/CommentSection.tsx]
    status: done
    checks:
      - id: 4.1
        description: >
          tsc --noEmit 无错误；无 console.log 调试输出
        status: done
      - id: 4.2
        description: >
          contentRewardService.config() 带 token 调 /api/v1/content-reward/config，启动时拉一次缓存；
          CreatePage 发布成功段显示 "+N 积分"（N 来自 config.postAmount）；enabled=false 不显示
        status: done
      - id: 4.3
        description: >
          CommentSection 评论 submit 成功后显示 "+N 积分" 轻提示（N 来自 config.commentAmount，1.5s 消失）；enabled=false 不显示
        status: done
      - id: 4.4
        description: >
          浏览器实测：发帖后 wallet 余额 +10 + 提示；发评论后 wallet 余额 +2 + 提示；刷新后余额持久化
        status: done
