feature: 2026-07-06-distributed-singleflight
slug: distributed-singleflight
status: approved
created: 2026-07-06
source_design: .codestable/features/2026-07-06-distributed-singleflight/distributed-singleflight-design.md
steps:
  - id: sf-01-common-core
    status: done
    title: 建立公共分布式 single-flight 骨架
    intent: 复制 AI-Meeting 的协调、通知、心跳、结果回放模式，并改成 zhiguang 公共命名与 typed codec。
    deliverables:
      - 公共 service / policy / coordinator / notification / heartbeat / local replay cache
      - JSON typed result codec 与 checksum 校验
      - stage 配置与全局开关
    exit_signal: 公共测试能证明同一 stage/requestKey 下只有 owner 执行 supplier，followers 读取 replay 结果。
    verification:
      type: test
      command: mvn -Dtest=*SingleFlight* test
      result: passed
      evidence: 2026-07-06 在隔离 worktree 中通过，覆盖 owner replay、follower replay、失败分类和 typed codec。
    design_refs:
      - "2.1"
      - "2.2"
  - id: sf-02-counter-sds
    status: done
    title: 接入实体计数 SDS 重建
    intent: 替换 getCounts 缺失分支里抢不到锁返回 0 的路径。
    deliverables:
      - counter-sds stage policy
      - getCounts 缺失/异常结构分支使用 single-flight 返回重建 map
      - 原有事实重建写 SDS 与 agg 清理语义保留
    exit_signal: 并发同一实体计数缺失时，事实重建只执行一次，所有成功调用返回 owner map。
    verification:
      type: test
      command: mvn -Dtest=*Counter*SingleFlight* test
      result: passed
      evidence: 2026-07-06 在隔离 worktree 中通过；同时 *SingleFlight* 覆盖公共核心回归。
    design_refs:
      - "2.2"
      - "3"
  - id: sf-03-user-counter
    status: done
    title: 接入用户维度计数重建
    intent: 让 ucnt 缺失和采样不一致时的 rebuildAllCounters 具备跨节点去重和结果复用。
    deliverables:
      - user-counter stage policy
      - UserCounterRebuildAdapter.rebuildAndRead(userId) 作为唯一结果来源
      - adapter 复用现有 rebuildAllCounters 写 SDS，并按 5 段 SDS 读取规则返回 map
      - 缺失和采样不一致两条触发路径均受保护
    exit_signal: 并发同一 userId 重建时 adapter 只执行一次，followers 返回同一 5 指标结果。
    verification:
      type: test
      command: mvn -Dtest=*UserCounter*SingleFlight* test
      result: passed
      evidence: 2026-07-06 在隔离 worktree 中通过；补充 RelationControllerSingleFlight、UserCounterRebuildAdapter 和 RelationManagerControllerTest 回归。
    design_refs:
      - "2.2"
      - "3"
  - id: sf-04-feed-author-head
    status: done
    title: 接入关注 Feed 作者 head 回源
    intent: 保护 cursor 为空的 author head cache miss，不改变 cursor 分页语义。
    deliverables:
      - feed-author-head stage policy
      - cursor == null 且 head cache miss 时使用 single-flight
      - cursor != null 分页路径保持直接查询
    exit_signal: 并发同一 authorId/safeLimit head miss 时 Cassandra authorRead 只执行一次，followers 返回同一列表。
    verification:
      type: test
      command: mvn -Dtest=DistributedSingleFlightServiceTest,FollowFeedServiceTest test
      result: passed
      evidence: 2026-07-06 在隔离 worktree 中通过；覆盖 feed-author-head 首屏 cache miss 进入 single-flight，cursor 翻页不增加 single-flight 调用，并回归 core stage/requestKey Redis key 作用域。
    design_refs:
      - "2.2"
      - "3"
  - id: sf-05-moderation-llm
    status: done
    title: 接入审核 LLM 调用去重
    intent: 复用 ModerationLlmResult，并用现有 pending 状态 CAS 保证内容处置和通知最多执行一次。
    deliverables:
      - moderation-llm stage policy
      - key 固定为 report:{reportId}:retry:{retryCount}
      - retryCount 来源于 findById(reportId) 读取到的 pending report，空值按 0 处理
      - llmClient.review(report) 被 single-flight 包裹
      - markReviewed / markIgnored 继续使用 WHERE status='pending' CAS
      - scheduleRetry 增加 sourceRetryCount CAS，条件包含 retry_count = sourceRetryCount
      - applyApprovedAction / notify 只允许终态更新 updated == 1 后执行
    exit_signal: 并发同一 pending report/retryCount 审核时 LLM client 只调用一次，数据库终态迁移或 retry 调度最多成功一次，通知路径最多执行一次，抢不到旧 Redisson lock 不再直接 return。
    verification:
      type: test
      command: mvn -Dtest=*SingleFlight*,FollowFeedServiceTest,ModerationReviewExecutorTest,RelationManagerControllerTest test
      result: passed
      evidence: 2026-07-06 在隔离 worktree 中通过；覆盖 moderation-llm key=report:{reportId}:retry:{retryCount}、LLM 调用 single-flight 包裹、scheduleRetry sourceRetryCount CAS 参数与 XML 条件、终态 CAS 后通知。
    design_refs:
      - "2.2"
      - "3"
  - id: sf-06-validation
    status: done
    title: 完成配置、回滚与验证
    intent: 让 feature 可观测、可关闭，并用测试覆盖 owner/follower、失败、接管和四个业务挂载点。
    deliverables:
      - disabled / local / distributed / hybrid 配置行为
      - 公共 owner/follower/failure/takeover 测试
      - 四个业务挂载点测试
      - Maven 验证记录
    exit_signal: checklist 中所有验收 checks 均有测试或命令证据，关闭开关后不写 single-flight Redis key。
    verification:
      type: command
      command: mvn test; mvn -Dtest=RedisDistributedSingleFlightIntegrationTest test; mvn -Dtest=*SingleFlight*,FollowFeedServiceTest,ModerationReviewExecutorTest,RelationManagerControllerTest,RelationManagerControllerWiringTest test; mvn -Dtest=ModerationLlmOpenAiCompatibleIntegrationTest -Dllm.integration=true test
      result: passed
      evidence: 2026-07-06 在 WSL Docker 依赖环境中启动 MySQL/Redis/Cassandra/Kafka/Elasticsearch 后，全量 mvn test 通过；RedisDistributedSingleFlightIntegrationTest 真实 Redis 专测通过；显式 LLM 集成测试通过；本 feature 目标集合通过，覆盖 disabled/local/hybrid、owner/follower/failure/takeover、真实 Redis Stream 通知与四个业务挂载点。
    design_refs:
      - "2.4"
      - "3"
checks:
  - id: ac-counter-sds-concurrency
    status: passed
    source: acceptance
    description: 同一实体计数 SDS 缺失并发请求只触发一次事实重建，followers 返回同一 map。
    covered_by:
      - sf-02-counter-sds
  - id: ac-user-counter-concurrency
    status: passed
    source: acceptance
    description: 同一用户计数 SDS 缺失或采样不一致时只触发一次全量重建。
    covered_by:
      - sf-03-user-counter
  - id: ac-feed-head-concurrency
    status: passed
    source: acceptance
    description: 同一作者 head cache miss 只触发一次 Cassandra authorRead，cursor 分页不进入该 key。
    covered_by:
      - sf-04-feed-author-head
  - id: ac-moderation-llm-dedupe
    status: passed
    source: acceptance
    description: 同一 pending report/retryCount 并发审核只调用一次 LLM，终态 CAS 成功一次，内容处置和通知最多执行一次。
    covered_by:
      - sf-05-moderation-llm
  - id: ac-moderation-retryable-cas
    status: passed
    source: acceptance
    description: 同一 pending report/retryCount 并发审核返回 retryableFailure 时，只允许一次 scheduleRetry 通过 sourceRetryCount CAS。
    covered_by:
      - sf-05-moderation-llm
  - id: ac-owner-failure-semantics
    status: passed
    source: acceptance
    description: retryable 与 non-retryable owner failure 分别产生可重试或失败回放语义。
    covered_by:
      - sf-01-common-core
      - sf-06-validation
  - id: ac-owner-takeover
    status: passed
    source: acceptance
    description: owner heartbeat 过期后后续请求可 takeover 并完成结果。
    covered_by:
      - sf-01-common-core
      - sf-06-validation
  - id: ac-rollback-switch
    status: passed
    source: acceptance
    description: 全局或 stage 关闭后业务回到原有路径，且不写入新的 single-flight Redis key。
    covered_by:
      - sf-06-validation
  - id: ac-existing-local-singleflight-scope
    status: passed
    source: explicit-non-goal
    description: 本轮不替换 KnowPostServiceImpl.getDetail 的本地 single-flight；如后续替换，必须先处理详情权限/缓存语义。
    covered_by:
      - sf-06-validation
dod:
  commands:
    - id: yaml-check
      command: python .codestable/tools/validate-yaml.py --file .codestable/features/2026-07-06-distributed-singleflight/distributed-singleflight-checklist.yaml --yaml-only
      core: true
      failure_handling: 修复 YAML 格式后重跑。
    - id: maven-all-tests
      command: mvn test
      core: true
      failure_handling: 归因既有红灯或本 feature 引入问题；本 feature 引入问题必须修复。
  artifacts:
    - 公共 single-flight 代码与配置
    - 四个业务挂载点改动
    - 并发单测与业务集成测试
    - design-review 报告
cleanup_rules:
  - 不保留临时调试日志。
  - 不新增 TODO/FIXME 作为实现占位。
  - 不保留无用 import 或注释掉的旧锁分支。
