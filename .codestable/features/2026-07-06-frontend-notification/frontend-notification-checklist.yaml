doc_type: checklist
feature: 2026-07-06-frontend-notification
status: pending
summary: 前端通知模块实现步骤与检查项
steps:
  - id: 1
    name: service + types（notificationService 4 方法 + types/notification）
    description: types/notification.ts 定义 NotificationType/NotificationItem（含 windowStart/windowEnd，id 全 string）/NotificationPage/NotificationUnreadCount；services/notificationService.ts 加 list/unreadCount/markRead/markAllRead，list 用 URLSearchParams 传 cursorCreatedAt+cursorId+limit（成对传），需 token
    exit_signal: cd zhiguang_fe && npm run lint 通过；curl GET /notifications -H "Authorization: Bearer <token>" 返回 200 + items 字段存在（可为空数组）
    verification: command
    deliverables: [services/notificationService.ts, types/notification.ts]
    status: done
    checks:
      - id: 1.1
        description: tsc --noEmit 无错误
        status: passed
      - id: 1.2
        description: NotificationItem id/actorUserId/entityId/secondEntityId 全 string（snowflake 精度防御）；含 windowStart/windowEnd（对齐后端契约，当前不渲染）；type 枚举含 like/comment/follow/moderation_action/report_processed
        status: passed
      - id: 1.3
        description: list(cursorCreatedAt, cursorId, limit, accessToken) 双游标成对传（都传或都不传，URLSearchParams）；unreadCount/markRead(id,token)/markAllRead(token) 签名正确；均显式传 accessToken
        status: passed
  - id: 2
    name: NotificationPage 列表 + 文案 + 跳转 + 空态
    description: 新建 pages/NotificationPage.tsx；list 首屏（cursorCreatedAt=null cursorId=null）+ 双游标加载更多按钮；type 文案映射 + aggregateCount 边界；点单条 markRead 成功后跳转 + 失败不跳显示错误；跳转按 type+entityType 二元组；空态"暂无通知"
    exit_signal: npm run lint 通过；浏览器登录后进 /notifications 看到通知列表（或空态）；点通知按 type+entityType 跳转正确
    verification: browser
    deliverables: [pages/NotificationPage.tsx, pages/NotificationPage.module.css]
    status: done
    checks:
      - id: 2.1
        description: tsc --noEmit 无错误
        status: passed
      - id: 2.2
        description: list 首屏 cursorCreatedAt=null cursorId=null；hasMore=true 显示"加载更多"按钮，点击 URLSearchParams 成对回传 nextCursorCreatedAt + nextCursorId 追加 items
        status: passed
      - id: 2.3
        description: type 文案映射（按 type+entityType）：like+knowpost→赞了你的文章，like+comment→赞了你的评论，comment→评论了你的文章，follow→关注了你；aggregateCount=1 无前缀（"赞了你的文章"），>1 前缀"{n} 人"（"3 人赞了你的文章"）
        status: passed
      - id: 2.4
        description: 点单条通知：markRead 成功后本地 isRead=true + 徽章 -1（无论是否跳转）；失败不跳 + 显示错误 + 通知保持未读；跳转映射 like+knowpost→/post/{entityId}，like+comment→不跳（但仍标记已读），comment→/post/{entityId}（entityId=postId），follow→/profile，其它→不跳；未读项视觉区分
        status: passed
      - id: 2.5
        description: 空态（items=[] 且 hasMore=false）显示"暂无通知"
        status: passed
  - id: 3
    name: Sidebar 徽章 + 标记已读同步 + harden + 清洁度
    description: Sidebar 加"通知"导航项 + NotificationBadge（未读红点数字，未登录不渲染）；Sidebar 引入 useAuth 取 tokens；徽章两时机拉取（Sidebar 挂载已登录时 + 进通知页时）；点单条 markRead 后本地 isRead=true + 徽章 -1；全部已读 markAllRead + 徽章 0；清洁度 grep
    exit_signal: 浏览器 Sidebar 通知项 + 徽章显示未读数 + 点通知标记已读徽章减 + 全部已读徽章清零 + 未登录无通知项 + 登入后停留首页徽章也有值 + grep 无 console.log/TODO/FIXME + npm run lint 通过 + 反向核对（无 actor 昵称查询 / 无 WebSocket / 后端 git diff 为空）
    verification: browser
    deliverables: [components/common/NotificationBadge.tsx, components/layout/Sidebar.tsx 修改, App.tsx 路由]
    status: done
    checks:
      - id: 3.1
        description: Sidebar 引入 useAuth 取 tokens（新增依赖）；加"通知"导航项（NavLink to=/notifications）；NotificationBadge 显示未读数（>0 红点数字，0 不显示）；未登录（tokens?.accessToken falsy）不渲染通知项
        status: passed
      - id: 3.2
        description: 点单条 markRead 成功后本地 item.isRead=true + 未读数 -1 + 徽章刷新；失败不跳 + 显示错误（通知保持未读）；"全部已读"markAllRead 成功后列表全 isRead + 未读 0
        status: passed
      - id: 3.3
        description: 徽章未读数两时机拉取：(a) Sidebar 挂载且已登录时（useEffect 依赖 tokens.accessToken），(b) 进 NotificationPage 时（本地同步减在 3.2 覆盖）
        status: passed
      - id: 3.4
        description: App.tsx 加 /notifications 路由指向 NotificationPage
        status: passed
      - id: 3.5
        description: grep 无 console.log / TODO / FIXME / 注释代码 / 死 import；反向核对：无 actor 昵称查询逻辑、无 WebSocket、后端 git diff 为空
        status: passed
