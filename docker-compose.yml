services:
  mysql:
    image: mysql:8.4
    container_name: zhiguang-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: zhiguang
      MYSQL_USER: zhiguang
      MYSQL_PASSWORD: zhiguang123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/canal-user.sql:/docker-entrypoint-initdb.d/02-canal-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot123456 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: zhiguang-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    container_name: zhiguang-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 双 listener：PLAINTEXT(kafka:9092) 供容器内 app 使用；EXTERNAL(localhost:9094) 供宿主机工具直连
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kafka-logs
    volumes:
      - kafka-data:/tmp/kafka-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  canal:
    image: canal/canal-server:v1.1.8
    container_name: zhiguang-canal
    restart: unless-stopped
    cpus: ${CANAL_CPUS:-0.35}
    mem_limit: ${CANAL_MEMORY_LIMIT:-512m}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms128m -Xmx256m -Xmn64m -XX:MaxMetaspaceSize=128m
      canal.auto.scan: "false"
      canal.destinations: example
      canal.instance.master.address: mysql:3306
      canal.instance.mysql.slaveId: "1001"
      canal.instance.dbUsername: canal
      canal.instance.dbPassword: ${CANAL_DB_PASSWORD:-canal123456}
      canal.instance.connectionCharset: UTF-8
      canal.instance.gtidon: "false"
      canal.instance.tsdb.enable: "false"
      canal.instance.parser.parallel: "false"
      canal.instance.memory.buffer.size: "1024"
      canal.instance.transaction.size: "256"
      canal.instance.filter.regex: 'zhiguang\.outbox'
    volumes:
      - canal-data:/home/admin/canal-server/conf/example
      - canal-logs:/home/admin/canal-server/logs
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 127.0.0.1 11111"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 20

  cassandra:
    image: cassandra:4.1
    container_name: zhiguang-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: zhiguang
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      TZ: Asia/Shanghai
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      # cqlsh can block indefinitely when Cassandra is saturated. Kill the child
      # process explicitly so health probes cannot accumulate and starve the node.
      test: ["CMD-SHELL", "timeout -k 1s 8s cqlsh --connect-timeout=3 --request-timeout=3 -e 'SELECT keyspace_name FROM system_schema.keyspaces LIMIT 1' >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  cassandra-init:
    image: cassandra:4.1
    container_name: zhiguang-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./db/cassandra/init.cql:/init.cql:ro
    entrypoint: ["cqlsh", "cassandra", "-f", "/init.cql"]

  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
    image: zhiguang-elasticsearch:9.2.1-ik
    container_name: zhiguang-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: zhiguang-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: zhiguang-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: zhiguang
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set download local/$$MINIO_BUCKET
      "

  gorse:
    image: zhenghaoz/gorse-in-one:0.5.8
    container_name: zhiguang-gorse
    restart: unless-stopped
    cpus: ${GORSE_CPUS:-0.75}
    mem_limit: ${GORSE_MEMORY_LIMIT:-640m}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - --log-path
      - /var/log/gorse/gorse.log
      - --log-max-size
      - "32"
      - --log-max-backups
      - "2"
      - --cache-path
      - /var/lib/gorse/master
    ports:
      - "127.0.0.1:8087:8088"
    volumes:
      - ./config/gorse.toml:/etc/gorse/config.toml:ro
      - gorse-data:/var/lib/gorse
      - gorse-logs:/var/log/gorse
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':1F98 .* 0A ' /proc/net/tcp /proc/net/tcp6"]
      interval: 15s
      timeout: 10s
      retries: 20

  # 应用服务：一键部署入口（docker compose up -d 自动构建并等待全栈健康）
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: zhiguang-app:latest
    container_name: zhiguang-app
    restart: unless-stopped
    cpus: ${APP_CPUS:-1.5}
    mem_limit: ${APP_MEMORY_LIMIT:-1280m}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      canal:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # 容器内通过服务名访问中间件（application.yml 的 localhost 仅宿主机直跑时有效）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/zhiguang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: zhiguang
      SPRING_DATASOURCE_PASSWORD: zhiguang123456
      SPRING_DATA_REDIS_HOST: redis
      REDISSON_CONNECTION_POOL_SIZE: ${REDISSON_CONNECTION_POOL_SIZE:-16}
      REDISSON_CONNECTION_MINIMUM_IDLE_SIZE: ${REDISSON_CONNECTION_MINIMUM_IDLE_SIZE:-2}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Compose 仅运行一个 app；它是唯一 Canal relay。任何额外业务实例必须设置 CANAL_ENABLED=false。
      CANAL_ENABLED: "true"
      CANAL_HOST: canal
      CANAL_PORT: 11111
      CANAL_DESTINATION: example
      CANAL_FILTER: zhiguang.outbox
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra
      SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
      SPRING_CASSANDRA_KEYSPACE_NAME: zhiguang
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      STORAGE_ENDPOINT: http://minio:9000
      GORSE_ENDPOINT: http://gorse:8088
      # 场景开关（可用 .env 或 export 覆盖）
      PROMOTION_BPRIME_ENABLED: ${PROMOTION_BPRIME_ENABLED:-false}
      PROMOTION_BPRIME_STREAM_SWEEP_INTERVAL_MS: ${PROMOTION_BPRIME_STREAM_SWEEP_INTERVAL_MS:-2000}
      PROMOTION_BPRIME_STREAM_READ_BATCH_SIZE: ${PROMOTION_BPRIME_STREAM_READ_BATCH_SIZE:-1000}
      PROMOTION_BPRIME_STREAM_RETAIN_EVENTS: ${PROMOTION_BPRIME_STREAM_RETAIN_EVENTS:-100000}
      PROMOTION_BPRIME_FAST_REJECT_ENABLED: ${PROMOTION_BPRIME_FAST_REJECT_ENABLED:-true}
      GORSE_ENABLED: ${GORSE_ENABLED:-true}
      GORSE_ITEM_TO_ITEM_NAME: ${GORSE_ITEM_TO_ITEM_NAME:-similar_topics}
      FEED_HOME_MIXED_ENABLED: ${FEED_HOME_MIXED_ENABLED:-true}
      SINGLEFLIGHT_MODE: ${SINGLEFLIGHT_MODE:-distributed}
      COMMENT_WRITE_CONCURRENCY: ${COMMENT_WRITE_CONCURRENCY:-4}
      PUBLISH_KAFKA_CONCURRENCY: ${PUBLISH_KAFKA_CONCURRENCY:-2}
      OUTBOX_CLEANUP_ENABLED: "true"
      OUTBOX_CLEANUP_RETENTION_HOURS: ${OUTBOX_CLEANUP_RETENTION_HOURS:-720}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  canal-data:
  canal-logs:
  cassandra-data:
  elasticsearch-data:
  minio-data:
  gorse-data:
  gorse-logs:
