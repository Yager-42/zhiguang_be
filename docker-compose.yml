services:
  mysql:
    image: mysql:8.4
    container_name: zhiguang-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: zhiguang
      MYSQL_USER: zhiguang
      MYSQL_PASSWORD: zhiguang123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot123456 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: zhiguang-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    container_name: zhiguang-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 双 listener：PLAINTEXT(kafka:9092) 供容器内 app 使用；EXTERNAL(localhost:9094) 供宿主机工具直连
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  cassandra:
    image: cassandra:4.1
    container_name: zhiguang-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: zhiguang
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      TZ: Asia/Shanghai
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30

  cassandra-init:
    image: cassandra:4.1
    container_name: zhiguang-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./db/cassandra/init.cql:/init.cql:ro
    entrypoint: ["cqlsh", "cassandra", "-f", "/init.cql"]

  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
    image: zhiguang-elasticsearch:9.2.1-ik
    container_name: zhiguang-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: zhiguang-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: zhiguang-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: zhiguang
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set download local/$$MINIO_BUCKET
      "

  gorse:
    image: zhenghaoz/gorse-in-one:latest
    container_name: zhiguang-gorse
    restart: unless-stopped
    profiles: ["recommendation"]
    command: ["--playground"]
    ports:
      - "8087:8088"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  # 应用服务：一键部署入口（docker compose up -d 自动构建并等待全栈健康）
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: zhiguang-app:latest
    container_name: zhiguang-app
    restart: unless-stopped
    cpus: ${APP_CPUS:-4.0}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # 容器内通过服务名访问中间件（application.yml 的 localhost 仅宿主机直跑时有效）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/zhiguang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: zhiguang
      SPRING_DATASOURCE_PASSWORD: zhiguang123456
      SPRING_DATA_REDIS_HOST: redis
      REDISSON_CONNECTION_POOL_SIZE: ${REDISSON_CONNECTION_POOL_SIZE:-128}
      REDISSON_CONNECTION_MINIMUM_IDLE_SIZE: ${REDISSON_CONNECTION_MINIMUM_IDLE_SIZE:-32}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra
      SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
      SPRING_CASSANDRA_KEYSPACE_NAME: zhiguang
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      STORAGE_ENDPOINT: http://minio:9000
      RECOMMENDATION_GORSE_ENDPOINT: http://gorse:8088
      # 场景开关（可用 .env 或 export 覆盖）
      PROMOTION_BPRIME_ENABLED: ${PROMOTION_BPRIME_ENABLED:-false}
      PROMOTION_BPRIME_STREAM_SWEEP_INTERVAL_MS: ${PROMOTION_BPRIME_STREAM_SWEEP_INTERVAL_MS:-2000}
      PROMOTION_BPRIME_STREAM_READ_BATCH_SIZE: ${PROMOTION_BPRIME_STREAM_READ_BATCH_SIZE:-1000}
      PROMOTION_BPRIME_STREAM_RETAIN_EVENTS: ${PROMOTION_BPRIME_STREAM_RETAIN_EVENTS:-100000}
      PROMOTION_BPRIME_FAST_REJECT_ENABLED: ${PROMOTION_BPRIME_FAST_REJECT_ENABLED:-true}
      GORSE_ENABLED: ${GORSE_ENABLED:-false}
      SINGLEFLIGHT_MODE: ${SINGLEFLIGHT_MODE:-distributed}
      COMMENT_WRITE_CONCURRENCY: ${COMMENT_WRITE_CONCURRENCY:-4}
      COMMENT_OUTBOX_CLEAN_INTERVAL_MS: ${COMMENT_OUTBOX_CLEAN_INTERVAL_MS:-86400000}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  cassandra-data:
  elasticsearch-data:
  minio-data:
